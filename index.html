<div id="toolbar">
	<label class="format-btn">
		<input type="checkbox" onclick="insert('b', 'txt')" id="bold">
		<b>B</b>
	</label>
	<label class="format-btn">
		<input type="checkbox" onclick="insert('i', 'txt')" id="italic">
		<i>I</i>
	</label>
	<label class="format-btn">
		<input type="checkbox" onclick="insert('u', 'txt')" id="underline">
		<u>U</u>
	</label>
	<label class="format-btn">
		<input type="checkbox" onclick="insert('ul', 'list')" id="bulletlist">
		<p>● --</p>
	</label>
</div>
<style>
.format-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
	transition-duration: 1s;
}

.format-btn input {
    display: none;
}

.format-btn {
    background: white;
}

.format-btn input:checked + b,
.format-btn input:checked + i {
    color: white;
}

.format-btn input:checked {
}

.format-btn:has(input:checked) {
    background: #444;
    color: white;
	transition-duration: 1s;
}
#editor {
	display: block;
	width: 50%;
	height: 50%;
	margin-left: auto;
	margin-right: auto;
	justify-content: center;
	resize: none;
	padding: 12px;
	border-sizing: border-box;
	border-radius: 4px;
	background-color: #f8f8f8;
	border: 2px solid #ccc;
}
#toolbar {
	margin-left: auto;
	margin-right: auto;
	width: 50%;
}

</style>
<br>
<div id="editor" contenteditable="true"></div>

<script>
let chars = [];
let active = [];
let chartype = 'txt';
let listactive = 0;
const textbox = document.getElementById('editor');
const outbox = document.getElementById("editor");

function insert(val, type) {
	chartype = type;
	if (type === 'txt') {
		if (!(active.includes(val))) {
			chars.push(`<${val}>`);
			active.push(val);
		} else if (active.includes(val)) {
			chars.push(`</${val}>`);
			active.splice(active.indexOf(val), 1);
		}
	} else if (type === 'list') {
		if (!(active.includes(val))) {
			chars.push(`<${val}>`);
			active.push(val);
		} else if (active.includes(val)) {
			chars.push(`</li></${val}>`);
			chartype = 'txt';
			active.splice(active.indexOf(val), 1);
		}
	}
	updateOutbox();
}

textbox.addEventListener('keydown', function (e) {
    e.preventDefault();
    if (e.key === "Backspace") {
        chars.pop();
    } 
    else if (e.key.length === 1) {
        let char = e.key;
        chars.push(char);
    }
	if (chartype === 'list') {
		if (e.key === "Enter") {
			chars.push("</li>");
			listactive = 0;
		}
		if (listactive === 0) {
			if (e.key === "Enter") {
				chars.push("<li>");
				listactive = 1;
			}
		}
	} else if (chartype === "txt") {
		if (e.key === "Enter") {
			chars.push("<br>");
		}
	}
    updateOutbox();
});

function updateOutbox() {
    outbox.innerHTML = chars.join('');
}
</script>
