<!Doctype html>
<html>
	<link href="style.css" rel="stylesheet" type="text/css">
</html>
<div id="toolbar">
	<label class="format-btn">
		<input type="checkbox" onclick="insert('b', 'txt')" id="bold">
		<b>B</b>
	</label>
	<label class="format-btn">
		<input type="checkbox" onclick="insert('i', 'txt')" id="italic">
		<i>I</i>
	</label>
	<label class="format-btn">
		<input type="checkbox" onclick="insert('u', 'txt')" id="underline">
		<u>U</u>
	</label>
	<label class="format-btn">
		<input type="checkbox" onclick="insert('ul', 'list')" id="bulletlist">
		<p>● --</p>
	</label>
</div>
<br>
<div id="editor" contenteditable="true"></div>
